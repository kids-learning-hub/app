<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TikTok connection</title>
<style>
  :root { --bg: #f6f7fb; --card: #fff; --ink: #1b1b3a; --muted: #5b6078; --accent: #1E5BFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #10132a; --card: #1b1f3d; --ink: #f2f3ff; --muted: #a9afd0; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 28px; max-width: 560px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  code { display: block; word-break: break-all; background: rgba(30,91,255,.08); border-radius: 12px; padding: 14px; font-size: 15px; }
  button { margin-top: 14px; border: 0; border-radius: 999px; padding: 12px 24px; background: var(--accent); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1 id="h">TikTok connected</h1>
  <p id="p">Copy this code and paste it in the setup window on your computer.</p>
  <code id="code"></code>
  <button id="copy" type="button">Copy</button>
</div>
<script>
  // Shows the OAuth "code" TikTok sends back, for the bot's one-time setup
  // (klh-marketing-bot/video/setup-tiktok.mjs). Nothing is stored or sent.
  var q = new URLSearchParams(location.search);
  var code = q.get('code');
  var el = document.getElementById('code');
  if (code) {
    el.textContent = code;
  } else {
    document.getElementById('h').textContent = 'No code received';
    document.getElementById('p').textContent = q.get('error_description') || q.get('error') || 'Start again from the setup window.';
    el.style.display = 'none';
    document.getElementById('copy').style.display = 'none';
  }
  document.getElementById('copy').onclick = function () {
    navigator.clipboard.writeText(code).then(function () { document.getElementById('copy').textContent = 'Copied ✓'; });
  };
</script>
</body>
</html>
