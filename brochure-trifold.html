<title>Kids Learning Hub — Tri-fold leaflet (4 languages)</title>
<meta name="description" content="Printable tri-fold (3-panel) leaflet for the Kids Learning Hub educational apps in 4 languages, with QR codes to the website." />
<meta name="robots" content="noindex,follow" />
<link rel="icon" href="logos/hub-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1E5BFF;--navy:#163A8C;--yellow:#FFC72C;--orange:#FF8A00;--pink:#FF4FA3;
  --sky:#49B6FF;--green:#42C85A;--purple:#7A4DFF;--ink:#12224E;--muted:#5B6B9C;--line:#E4ECFA;
  --grad:linear-gradient(135deg,var(--blue),var(--purple));
}
html,body{background:#eef4ff}
body{font-family:"Nunito",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:20px 12px 60px}
[dir="rtl"] body{font-family:"Nunito","Segoe UI","Tahoma",sans-serif}
h1,h2,h3,h4,.brand{font-family:"Baloo 2","Nunito",sans-serif}
img{display:block;max-width:100%}

/* toolbar */
.toolbar{max-width:1000px;margin:0 auto 14px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(20,45,110,.12);padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.toolbar .ttl{font-family:"Baloo 2";font-weight:800;font-size:16px;margin-inline-end:auto;display:flex;align-items:center;gap:10px}
.toolbar .ttl img{width:34px;height:34px;object-fit:contain;border-radius:9px}
.langsw{display:flex;gap:5px;background:#f2f6ff;border:1px solid var(--line);border-radius:12px;padding:4px}
.langsw button{padding:7px 13px;border:none;background:none;border-radius:9px;font:inherit;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer}
.langsw button.active{background:var(--grad);color:#fff}
.btn{border:none;cursor:pointer;font:inherit;font-weight:800;font-size:14px;padding:11px 18px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.btn svg{width:18px;height:18px}
.btn-print{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(30,91,255,.3)}
.btn-print:hover{transform:translateY(-2px)}
.btn-all{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.hint{max-width:1000px;margin:0 auto 16px;text-align:center;color:var(--muted);font-weight:700;font-size:13.5px}
.stage{overflow-x:auto;padding-bottom:8px}

/* sheet = A4 landscape, 3 panels */
.lgset{display:none}
.lgset.active{display:block}
.sheet{width:297mm;height:210mm;background:#fff;display:flex;margin:0 auto 20px;box-shadow:0 18px 50px rgba(20,45,110,.18);border-radius:4px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.panel{width:99mm;flex:none;padding:11mm 9mm;display:flex;flex-direction:column;position:relative;overflow:hidden}
.panel + .panel{border-inline-start:1px dashed #ccd8f2}
.plabel{position:absolute;top:3mm;inset-inline-start:50%;transform:translateX(-50%);font-size:8px;font-weight:800;color:#adbcdf;letter-spacing:1px;text-transform:uppercase}

/* front cover */
.panel.front{background:radial-gradient(120% 90% at 50% 0,rgba(255,255,255,.18),transparent 55%),var(--grad);color:#fff;align-items:center;text-align:center;justify-content:center;gap:5mm}
.panel.front .logo{width:44mm;height:44mm;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.3))}
.panel.front .brand{font-size:27px;font-weight:800;line-height:1.05}
.panel.front .ftag{font-weight:800;font-size:12.5px;letter-spacing:.5px;opacity:.95}
.panel.front .cline{font-size:13px;font-weight:700;opacity:.95;max-width:70mm;margin-top:2mm}
.qrcard{background:#fff;border-radius:14px;padding:8px;box-shadow:0 8px 20px rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:3mm}
.qrcard img{width:40mm;height:40mm}
.qrcard .scan{color:var(--navy);font-weight:800;font-size:11px}
.qrcard .u{color:var(--blue);font-weight:700;font-size:9.5px}

/* generic headings */
.p-t{font-family:"Baloo 2";font-weight:800;font-size:16px;color:var(--blue);margin-bottom:5mm;padding-bottom:2mm;border-bottom:2px solid var(--line)}

/* back cover */
.panel.back{justify-content:space-between}
.panel.back .bhead{display:flex;align-items:center;gap:9px;margin-bottom:5mm}
.panel.back .bhead img{width:21mm;height:21mm;object-fit:contain}
.panel.back .bhead b{font-family:"Baloo 2";font-size:16px}
.panel.back p{font-size:11.5px;color:#33436b;font-weight:600;line-height:1.55;margin-bottom:4mm}
.freechip{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;font-weight:800;font-size:11px;padding:5px 11px;border-radius:20px;margin-bottom:5mm}
.contact{font-size:11px;font-weight:700;color:var(--navy);line-height:1.8}
.contact .u{color:var(--blue)}
.copy{margin-top:auto;font-size:9.5px;color:var(--muted);font-weight:700}

/* fold-in flap (CTA + features) */
.panel.flap{background:linear-gradient(160deg,#EAF3FF,#F3ECFF)}
.flist{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:6mm}
.flist li{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--navy)}
.flist .ck{width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.flist .ck svg{width:11px;height:11px}
.skillbox{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center;margin-bottom:6mm}
.skillbox b{display:block;font-family:"Baloo 2";color:var(--purple);font-size:13px;margin-bottom:3px}
.skillbox span{font-weight:800;font-size:12.5px;color:var(--navy)}
.ctabox{margin-top:auto;background:var(--grad);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:800;font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* inside app rows */
.tapps{display:flex;flex-direction:column;gap:4mm}
.tapps.fill{flex:1;justify-content:space-around;gap:2.5mm}
.tapp{display:flex;gap:8px;align-items:center;background:#F7FAFF;border:1px solid var(--line);border-radius:14px;padding:5px 8px}
.tapp .ic{width:16mm;height:16mm;border-radius:11px;overflow:hidden;position:relative;display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 5px 12px rgba(20,45,110,.2);flex:none}
.tapp .ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tapp .tx{flex:1;min-width:0}
.tapp .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tapp .nm b{font-size:13.5px;color:var(--ink)}
.tapp .subj{color:#fff;font-weight:800;font-size:9px;padding:2px 7px;border-radius:20px}
.tapp .desc{font-size:10px;color:#33436b;font-weight:600;line-height:1.3;margin-top:2px}
.tapp .gp{display:inline-flex;align-items:center;gap:4px;margin-top:4px;background:#111827;color:#fff;font-weight:800;font-size:8.5px;padding:2px 7px;border-radius:6px}
.tapp .gp svg{display:block}
.tapp .miniqr{width:19mm;height:19mm;flex:none;align-self:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px}
.p-foot{margin-top:auto;font-size:9.5px;color:var(--muted);font-weight:700;text-align:center}

/* print */
@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff;padding:0}
  .toolbar,.hint{display:none!important}
  .plabel{display:none}
  .stage{overflow:visible}
  .sheet{box-shadow:none;border-radius:0;margin:0;display:none;page-break-after:always}
  .lgset.active .sheet{display:flex}
  body.print-all .lgset .sheet{display:flex}
}
</style>
<script src="analytics.js" defer></script>
</head>

function tapp(a,lg){
  const id = a.file.replace('.png','');
  return `<div class="tapp">
    <div class="ic" style="background:${a.color}">${a.emoji||''}<img src="logos/${a.file}" alt="${a.name}" onerror="this.remove()"></div>
    <div class="tx">
      <div class="nm"><b>${a.name}</b><span class="subj" style="background:${a.color}">${a.subj[lg]}</span></div>
      <p class="desc">${a.desc[lg]}</p>
      <span class="gp">${gpSvg} Google Play</span>
    </div>
    <img class="miniqr" src="qr/${id}.svg" alt="QR ${a.name} on Google Play" title="${a.name} · Google Play">
  </div>`;
}

      <div class="ctabox">${t.flapCta}</div>
    </div>`;
  const in1 = `<div class="panel"><span class="plabel">${t.labels.inside} 1</span><div class="p-t">${t.appsT}</div><div class="tapps fill">${APPS.slice(0,4).map(a=>tapp(a,lg)).join('')}</div></div>`;
  const in2 = `<div class="panel"><span class="plabel">${t.labels.inside} 2</span><div class="p-t">${t.appsMore}</div><div class="tapps fill">${APPS.slice(4,8).map(a=>tapp(a,lg)).join('')}</div></div>`;
  const in3 = `<div class="panel"><span class="plabel">${t.labels.inside} 3</span><div class="p-t">${t.appsMore}</div><div class="tapps">${APPS.slice(8,10).map(a=>tapp(a,lg)).join('')}</div>
      <div class="skillbox" style="margin-top:5mm"><b>${t.skillsTitle}</b><span>${t.skills}</span></div>
      <div class="qrcard" style="box-shadow:none;border:1.5px solid var(--line);margin-top:auto"><img src="qr.svg" alt="QR" style="width:38mm;height:38mm"><div class="scan">${t.scanExplore}</div><div class="u">${SITE}</div></div>
    </div>`;
  return `<div class="lgset ${lg===lang?'active':''}" data-lang="${lg}" dir="${t.dir}">
    <div class="sheet outside">${flap}${back}${front}</div>
    <div class="sheet inside">${in1}${in2}${in3}</div>
  </div>`;
}

function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = L[lang].dir;
  document.getElementById('sets').innerHTML = ORDER.map(setHTML).join('');
  document.getElementById('langsw').innerHTML = ORDER.map(lg=>
    `<button class="${lg===lang?'active':''}" onclick="setLang('${lg}')">${L[lg].flag} ${L[lg].label}</button>`).join('');
  document.getElementById('printLbl').textContent = L[lang].print;
  document.getElementById('printAllLbl').textContent = L[lang].printAll;
  document.getElementById('tw').textContent = L[lang].tw;
  document.getElementById('hint').textContent = L[lang].hint;
}
function setLang(l){ lang=l; render(); }

/* Fit the wide A4-landscape sheets to the screen (they print full size). */
function fit(){
  const sets = document.getElementById('sets');
  sets.style.zoom = '1';
  const avail = document.documentElement.clientWidth - 28;
  sets.style.zoom = Math.min(1, avail / 1123);
}
function printOne(){ document.body.classList.remove('print-all'); document.getElementById('sets').style.zoom='1'; window.print(); }
function printAll(){ document.body.classList.add('print-all'); document.getElementById('sets').style.zoom='1'; window.print(); }
window.addEventListener('beforeprint',()=>{ document.getElementById('sets').style.zoom='1'; });
window.addEventListener('afterprint',()=>{ document.body.classList.remove('print-all'); fit(); });
window.addEventListener('resize', fit);

render();
fit();
</script>
</body>
</html>
